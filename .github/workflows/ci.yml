name: Marine Monitor CI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: npm install --no-audit --no-fund
      - name: Decoder + relay tests (AIS, DSC, NAVTEX, 406 MHz, grid squares, bearings, weather)
        run: npm test
      - name: Software receiver tests (DSC + AIS decoded from synthetic IC-9100 audio, CI-V, scan plans)
        run: |
          pip install numpy websockets
          python -m unittest discover -s tests -p 'test_dsp.py' -v
          VERBOSE=1 python tests/live_ws.py
          python -m py_compile helper/*.py && python helper/marine_helper.py --help
          for f in pi/*.sh; do bash -n "$f"; done && shellcheck -S error pi/*.sh
      - name: Browser test (radar, map, GMDSS, weather, day/night faceplates)
        shell: bash
        run: |
          npx playwright install --with-deps chromium
          set +e; npm run test:e2e 2>&1 | tee e2e.log; st=${PIPESTATUS[0]}
          if [ $st -ne 0 ]; then echo "::error title=Browser test failed::$(tail -n 20 e2e.log | tr -d '\r' | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g')"; fi
          exit $st

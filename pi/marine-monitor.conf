# Marine Monitor station settings (bash). After editing:  sudo systemctl restart marine-monitor
# Find radios and sound cards with /opt/marine-monitor/list-devices.sh
# Prefer /dev/serial/by-id/... names: they don't swap when cables are re-plugged.
# Comment out (#) the lines for radios that aren't connected.
# These radio lines are used the first time only. After that, change radios, ports and modes in the app
# (Receiver tab → Radio connections → Apply to station); they are saved in /opt/marine-monitor/helper/station.json.
# To go back to the lines below: sudo rm /opt/marine-monitor/helper/station.json && sudo systemctl restart marine-monitor

# --- Relay: your Render address and the FEED_KEY you set on Render (keep it private) ---
RELAY=(--relay https://marine-monitor-16qf.onrender.com --feed-key "PUT-YOUR-FEED_KEY-HERE")

# --- Band A: Uniden UM435 (DSC watch; NMEA OUT -> USB-NMEA adapter) ---
UM435=(--serial /dev/ttyUSB0 --baud 4800)

# --- Band B: Icom IC-9100 (USB cable: CI-V + "USB Audio CODEC") ---
#IC9100=(--rig ic9100 --civ-port /dev/ttyUSB1 --audio "USB Audio CODEC" --mode ais-a)

# --- Band C: Kenwood TH-D74 (micro-USB: COM + audio; Menu 980 COM+AF/IF Output, Menu 102 Detect) ---
#THD74=(--d74-port /dev/ttyACM0 --d74-audio "TH-D74" --d74-mode ais-b)
#   ...or its speaker into the Plugable USB adapter:  --d74-audio "USB Audio Device" --d74-mode dsc70

# --- Share radio AIS with AIS networks (ask each for a UDP host:port) ---
#SHARE=(--forward vesseltracker=HOST:PORT --forward aishub=HOST:PORT)

# --- Anything else, e.g. --dwell 30 or --no-netcheck ---
EXTRA=()
